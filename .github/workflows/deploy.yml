name: Update stats and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # daily, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build data.json (private repos included when STATS_TOKEN is set)
        run: node scripts/update-data.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
